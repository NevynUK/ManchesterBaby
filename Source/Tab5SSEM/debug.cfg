# debug.cfg -- OpenOCD configuration for debugging Tab5SSEM on the M5Stack Tab5
# over the ESP32-P4's built-in USB-Serial/JTAG (the USB-C port,
# /dev/cu.usbmodem*).  Used by CLion's "Tab5 Debug (OpenOCD)" and
# "Tab5 Attach (OpenOCD)" run configurations, and from the command line:
#
#   ./debug.sh                  (starts OpenOCD with this file)
#   riscv32-esp-elf-gdb -x gdbinit build/Tab5SSEM.elf
#
# The board has two USB paths and they are NOT interchangeable:
#
#   /dev/cu.usbmodem*    USB-Serial/JTAG -- esptool (flash) and OpenOCD (debug)
#   /dev/cu.usbserial-*  external bridge on UART0 -- the application console
#
# esptool and OpenOCD both need the USB-Serial/JTAG device, so OpenOCD must be
# stopped before flashing.  The console can stay open on UART0 throughout.

# FreeRTOS thread awareness is left at Espressif's default (on), so CLion's
# Threads pane lists the tasks (main, IDLE0/1, ipc0/1, esp_timer).
#
# On the same Tab5 with a different application (ESP32-P4-Protected-Mode-Sample)
# CLion 2026.3 missed the first stop after a reset with awareness on: the stop
# is reported on thread 2, CLion logs "Cannot retrieve info for thread 2", and
# the session looks as if it is still running while the core sits halted (2 of
# 3 launches failed).  This project was tested for that on 2026-11-11 (IDF 6.1,
# CLion 2026.3, OpenOCD v0.12.0-esp32-20260703): 3 of 3 launches stopped
# correctly at app_main with six task threads shown, and OpenOCD confirmed the
# core halted there each time.  If the symptom appears, uncomment this line:
#
# set ESP_RTOS none

source [find board/esp32p4-builtin.cfg]

# Turn every GDB breakpoint into a hardware one.  CLion's line breakpoints are
# software breakpoints: they do nothing in XIP flash, and in IRAM the
# second-stage bootloader overwrites them when it copies IRAM from flash on
# every reset.  GDB still shows them armed.  The cost is the trigger budget,
# so keep the number of enabled breakpoints small.
gdb breakpoint_override hard

# An IDE Stop halts the core before GDB detaches, which otherwise leaves the
# board frozen after every debug session.  Resume it on detach instead.  The
# curstate check avoids "Not halted" when GDB went away while the core ran.
$_TARGETNAME_0 configure -event gdb-detach {
	if { [$_TARGETNAME_0 curstate] eq "halted" } { resume }
}
